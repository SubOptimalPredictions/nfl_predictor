name: Update NFL Schedule

on:
  schedule:
    # Run every Tuesday at 8:00 AM UTC (Adjust cron as needed)
    - cron: '0 8 * * 2'
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # PERMISSIONS: Critical for allowing the Action to push changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Run update script
        # 'uv run' will automatically install dependencies from pyproject.toml 
        # and run the script in that environment.
        run: uv run scripts/test_nfl_api.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add the specific file you updated
          git add data/schedules_2026.csv
          
          # Check if there are changes before committing to avoid errors
          if [[ -n $(git status -s) ]]; then
            git commit -m "data: auto-update nfl schedule [skip ci]"
            git push
          else
            echo "No changes to schedule found."
          fi
